<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="/script"></script>
        <link rel="stylesheet" href="/style">
        <title>Little Saint Games V1.12.1</title>
    </head>
    <body>
        <nav>
            <h1>Little Saint Games V1.12.1</h1>
        </nav>
        <div class="container">
            <div id="kidnapContainer">
                <iframe id="scratchFrame" src="/scratchembed?q=0" class="clickerFrame"></iframe>
            </div>
            <div id="counts">
                <h2>Stats</h2>
                <p id="ccno">Children Collected: Loading...</p>
                <p id="cno">Cash: Loading...</p>
                <p id="bno">Bags: Loading...</p>
                <h3>Restock Bags</h3>
                <p>Bag price: $10/ea</p>
                <button class="plusminus" onclick="if(parseInt(document.getElementById('bagAmt').value) > 0){document.getElementById('bagAmt').value = parseInt(document.getElementById('bagAmt').value) - 10;updateBagTotal()}">-10</button><input type="number" id="bagAmt" value="10" min="0" onchange="updateBagTotal()"><button class="plusminus" onclick="document.getElementById('bagAmt').value = parseInt(document.getElementById('bagAmt').value) + 10;updateBagTotal()">+10</button><br>
                <p id="bagTotal">Total: $100</p>
                <button onclick="buyBags()">Buy Bags</button>
            </div>
            <div id="marketContainer">
                <iframe id="scratchFrame" src="/scratchembed?q=1" class="clickerFrame"></iframe>
            </div>
            <div id="marketStats">
                <h2>Market Stats</h2>
                <p id="mktval">Child Value: Loading...</p>
                <p id="totalmktval">Total Current Value: Loading...</p>
                <button onclick="sellChildren()">Sell Children</button>
            </div>
            <div id="warehouseContainer">
                <iframe id="scratchFrame" src="/scratchembed?q=2" class="clickerFrame"></iframe>
            </div>
            <div id="warehouseStats">
                <h2>Warehouse Stats</h2>
                <p id="warecap">Warehouse Capacity: Loading...</p>
            </div>
        </div>
    </body>
    <script>pageloaded()</script>
</html>
